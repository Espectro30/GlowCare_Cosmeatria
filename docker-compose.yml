version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: glowcare_backend
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      # Ignoramos la sobrescritura del entorno si ya instaló
      - /app/venv
    environment:
      - DEBUG=1
      - DB_PATH=/app/data/db.sqlite3
    command: sh -c "python manage.py makemigrations usuarios servicios citas auditoria && python manage.py migrate && python create_admin.py && python manage.py runserver 0.0.0.0:8003"

  frontend:
    build:
      context: ./frontend
    container_name: glowcare_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    command: npm run dev

volumes:
  backend_data:
